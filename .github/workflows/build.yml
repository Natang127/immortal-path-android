name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk immortal-path.apk
      - uses: actions/upload-artifact@v4
        with: { name: immortal-path-apk, path: immortal-path.apk }
      - name: Publish a release with the APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest immortal-path.apk --title "Immortal Path APK (build ${{ github.run_number }})" --notes "Latest build."
