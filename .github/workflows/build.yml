name: Build Jarvis APK
on:
  push:
    branches: [jarvis-remote]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk jarvis-remote.apk
      - uses: actions/upload-artifact@v4
        with: { name: jarvis-remote-apk, path: jarvis-remote.apk }
      - name: Publish a release with the APK
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete jarvis-latest --yes --cleanup-tag || true
          gh release create jarvis-latest jarvis-remote.apk --target jarvis-remote --latest=false --title "Jarvis Remote APK (build ${{ github.run_number }})" --notes "Download jarvis-remote.apk on your phone and open it to install."
