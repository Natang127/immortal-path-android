plugins { id 'com.android.application' }
android {
    namespace 'com.immortalpath.game'
    compileSdk 34
    defaultConfig { applicationId 'com.immortalpath.game'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
    androidResources { noCompress 'html' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
